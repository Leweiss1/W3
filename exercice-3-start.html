<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        padding: 1rem;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        font-family: sans-serif;
        color: white;
      }

      header {
        background: #1e90ff;
        box-shadow: 0 4px #0077ea;
        border-radius: 0.5rem;
        padding: 1rem;
      }

      .container {
        display: flex;
        flex-grow: 1;
        gap: 1rem;
      }

      main {
        background: #3cb371;
        box-shadow: 0 4px #2f8d59;
        border-radius: 0.5rem;
        flex-grow: 1;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .items {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .item {
        background: #2f8d59;
        box-shadow: 0 4px #226741;
        border-radius: 0.5rem;
        width: 5rem;
        height: 3rem;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .sidebar {
        background: #ff6347;
        box-shadow: 0 4px #e02200;
        border-radius: 0.5rem;
        width: 8rem;
        padding: 1rem;
      }

      footer {
        background: #4169e1;
        box-shadow: 0 4px #1d44b8;
        border-radius: 0.5rem;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <header>header</header>
    <div class="container">
      <main>
        <div>main</div>
        <div class="items">
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
          <div class="item">item</div>
        </div>
      </main>
      <div class="sidebar">sidebar</div>
    </div>
    <footer>footer</footer>
  </body>
</html>
